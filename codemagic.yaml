workflows:
  ios-sim:
    name: iOS simulator build for Appetize
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.41.7        # pinned: intl 0.20.2 exact
      xcode: latest
      cocoapods: default
    scripts:
      - name: pub get
        script: flutter pub get
      - name: build simulator app
        script: flutter build ios --simulator
      - name: zip bundle
        script: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app Runner.zip
    artifacts:
      - Runner.zip